$kind: http-request
url: "{{base_url}}/users/login"
method: POST
body:
  type: json
  content: |-
    {
      "email": "qa.test2@example.com",
      "password": "TestPassword123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Access token is returned", function () {
          const response = pm.response.json();

          pm.expect(response.access_token).to.be.a("string");
          pm.expect(response.access_token).to.not.be.empty;
      });

      pm.test("Token type is bearer", function () {
          const response = pm.response.json();

          pm.expect(response.token_type).to.eql("bearer");
      });

      pm.test("Refresh token cookie is set", function () {
          const cookies = pm.response.headers.get("Set-Cookie");

          pm.expect(cookies).to.include("refresh_token");
      });
    language: text/javascript
order: 5000
