    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Item has correct title", function () {
          const response = pm.response.json();
          pm.expect(response.title).to.eql("QA Test Item");
      });

      pm.test("Item has correct description", function () {
          const response = pm.response.json();
          pm.expect(response.description).to.eql("Created during manual API testing");
