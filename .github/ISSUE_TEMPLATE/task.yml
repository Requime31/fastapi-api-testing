name: Task / Question
description: Mirror of a Jira task — checklist run, regression, report or a question to the developer
title: "[FAT-N] <Short description>"
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Mirror of a Jira task. For a question to the developer, replace the `task` label with `question`.

  - type: input
    id: jira
    attributes:
      label: Jira
      description: Jira key and link
      placeholder: "FAT-1 — https://romanshevchenko316.atlassian.net/browse/FAT-1"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: |
        Run checklist CL-01 Auth (118 checks) on Local (Docker), build 660708b.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Definition of done
      placeholder: |
        - every check has a status
        - defects are filed in Jira and mirrored here
    validations:
      required: false
