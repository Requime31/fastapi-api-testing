name: Bug report
description: Defect found while testing the API (mirror of a Jira bug)
title: "[FAT-N] <Endpoint>: <what is wrong> when <condition>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Mirror of a Jira bug. File the bug in Jira (project FAT) first, then copy the key here and translate the description into English.
        Add `severity:*` and `component:*` labels and set the test cycle milestone. The issue number should match the Jira key (FAT-N ↔ #N).

  - type: input
    id: jira
    attributes:
      label: Jira
      description: Jira key and link
      placeholder: "FAT-12 — https://romanshevchenko316.atlassian.net/browse/FAT-12"
    validations:
      required: true

  - type: input
    id: check
    attributes:
      label: Checklist check
      description: ID of the check that found the defect
      placeholder: "CL-02 / PAG-16"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Scale from the Test Plan, section 7.1
      options:
        - Blocker
        - Critical
        - Major
        - Minor
        - Trivial
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Highest
        - High
        - Medium
        - Low
        - Lowest
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Local (Docker), build 660708b"
    validations:
      required: true

  - type: textarea
    id: preconditions
    attributes:
      label: Preconditions
      placeholder: |
        1. User A is registered and logged in
        2. The database contains 25 items
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Method, URL, headers, body — cURL is the easiest
      placeholder: |
        1. Send the request:
           curl -X GET "http://localhost:8000/items/all?page=0" -H "Authorization: Bearer <token>"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Status code and response body; database state and logs if relevant
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: With the source of the requirement (README / Swagger / RFC / common practice)
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Attachments and notes
      description: Postman screenshots, container logs, link to the code line
    validations:
      required: false
